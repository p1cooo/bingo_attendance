name: Deploy Attendance production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendance-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ATTENDANCE_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done
          key="$RUNNER_TEMP/attendance-deploy-key"
          known_hosts="$RUNNER_TEMP/attendance-known-hosts"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "bash -se -- '$GITHUB_SHA'" < scripts/deploy-production.sh
